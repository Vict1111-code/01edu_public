name: Galaxy curriculum audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/galaxy-curriculum-audit
    paths:
      - '.github/workflows/galaxy-curriculum-audit.yml'
      - 'research/galaxy-audit/scripts/**'

permissions:
  contents: read

concurrency:
  group: galaxy-curriculum-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    name: Test and extract subject references
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research branch (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute extractor tests
        run: node --test research/galaxy-audit/scripts/extract-subject-links.test.mjs

      - name: Execute curated graph unit tests
        run: node --test research/galaxy-audit/scripts/build-curated-graph.test.mjs

      - name: Run Piscine evidence checks
        run: node --test research/galaxy-audit/scripts/classify-piscine-evidence.test.mjs

      - name: Classify Piscine evidence
        run: node research/galaxy-audit/scripts/classify-piscine-evidence.mjs . research/galaxy-audit/generated

      - name: Test progressive Piscine study paths
        run: node --test research/galaxy-audit/scripts/sequence-piscines.test.mjs

      - name: Build progressive Piscine study paths
        run: node research/galaxy-audit/scripts/sequence-piscines.mjs . research/galaxy-audit/generated

      - name: Test Piscine competency and evidence extractor
        run: node --test research/galaxy-audit/scripts/build-piscine-competencies.test.mjs

      - name: Generate per-exercise requirements and mastery gates
        run: node research/galaxy-audit/scripts/build-piscine-competencies.mjs . research/galaxy-audit/generated

      - name: Test difficulty ranking and prerequisite review
        run: node --test research/galaxy-audit/scripts/rank-piscine-difficulty.test.mjs

      - name: Rank exercise difficulty and inspect prerequisite evidence
        run: node research/galaxy-audit/scripts/rank-piscine-difficulty.mjs . research/galaxy-audit/generated

      - name: Test concept prerequisite maps and source identity corrections
        run: node --test research/galaxy-audit/scripts/build-concept-prerequisites.test.mjs

      - name: Build concept prerequisite maps and outlier queues
        run: node research/galaxy-audit/scripts/build-concept-prerequisites.mjs . research/galaxy-audit/generated

      - name: Extract the entire public subjects tree
        run: node research/galaxy-audit/scripts/extract-subject-links.mjs . research/galaxy-audit/generated

      - name: Deduplicate and triage candidate project links
        run: node research/galaxy-audit/scripts/triage-subject-links.mjs research/galaxy-audit/generated

      - name: Build evidence-typed graph
        run: node research/galaxy-audit/scripts/build-curated-graph.mjs research/galaxy-audit/generated

      - name: Print and save scan summary
        shell: bash
        run: |
          node --input-type=module <<'EOF' | tee research/galaxy-audit/generated/summary.txt
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('research/galaxy-audit/generated/subject-link-extraction.json', 'utf8'));
          const hist = {};
          for (const edge of r.edges) hist[edge.type] = (hist[edge.type] || 0) + 1;
          console.log(JSON.stringify({ ...r.metadata, relation_types: hist }, null, 2));
          if (r.metadata.subject_count < 1000) {
            throw new Error('Unexpectedly small subject count; audit source checkout');
          }
          EOF

      - name: Upload JSON, CSV and summary
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-subject-link-audit
          path: |
            research/galaxy-audit/generated/subject-link-extraction.json
            research/galaxy-audit/generated/subject-link-edges.csv
            research/galaxy-audit/generated/subject-node-summary.csv
            research/galaxy-audit/generated/summary.txt
            research/galaxy-audit/generated/triaged-project-links.json
            research/galaxy-audit/generated/triage-summary.json
            research/galaxy-audit/generated/curated-galaxy-graph.json
            research/galaxy-audit/generated/curated-galaxy-edges.csv
            research/galaxy-audit/generated/piscine-language-evidence.json
            research/galaxy-audit/generated/piscine-explicit-mentions.json
            research/galaxy-audit/generated/piscine-progressive-sequences.json
            research/galaxy-audit/generated/go-progressive-sequence.csv
            research/galaxy-audit/generated/rust-progressive-sequence.csv
            research/galaxy-audit/generated/javascript-progressive-sequence.csv
            research/galaxy-audit/generated/go-progressive-study-guide.md
            research/galaxy-audit/generated/rust-progressive-study-guide.md
            research/galaxy-audit/generated/javascript-progressive-study-guide.md
            research/galaxy-audit/generated/piscine-competency-evidence.json
            research/galaxy-audit/generated/go-mastery-and-requirements.md
            research/galaxy-audit/generated/rust-mastery-and-requirements.md
            research/galaxy-audit/generated/javascript-mastery-and-requirements.md
            research/galaxy-audit/generated/piscine-difficulty-and-dependency-review.json
            research/galaxy-audit/generated/piscine-unmatched-review.json
            research/galaxy-audit/generated/go-difficulty-ranked-guide.md
            research/galaxy-audit/generated/rust-difficulty-ranked-guide.md
            research/galaxy-audit/generated/javascript-difficulty-ranked-guide.md
            research/galaxy-audit/generated/piscine-concept-prerequisite-graph.json
            research/galaxy-audit/generated/go-concept-prerequisite-guide.md
            research/galaxy-audit/generated/rust-concept-prerequisite-guide.md
            research/galaxy-audit/generated/javascript-concept-prerequisite-guide.md
          retention-days: 14
          if-no-files-found: error
