name: Galaxy curriculum audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/galaxy-curriculum-audit
    paths:
      - '.github/workflows/galaxy-curriculum-audit.yml'
      - 'research/galaxy-audit/scripts/**'
      - 'research/galaxy-audit/data/phase18*'
      - 'research/galaxy-audit/data/phase20*'
      - 'research/galaxy-audit/data/phase21*'
      - 'research/galaxy-audit/data/phase22*'
      - 'research/galaxy-audit/data/phase23*'
      - 'research/galaxy-audit/data/phase24*'
      - 'research/galaxy-audit/data/phase25*'
      - 'research/galaxy-audit/data/phase26*'
      - 'research/galaxy-audit/data/phase27*'

permissions:
  contents: read

concurrency:
  group: galaxy-curriculum-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    name: Test and extract subject references
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research branch (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute extractor tests
        run: node --test research/galaxy-audit/scripts/extract-subject-links.test.mjs

      - name: Execute curated graph unit tests
        run: node --test research/galaxy-audit/scripts/build-curated-graph.test.mjs

      - name: Run Piscine evidence checks
        run: node --test research/galaxy-audit/scripts/classify-piscine-evidence.test.mjs

      - name: Classify Piscine evidence
        run: node research/galaxy-audit/scripts/classify-piscine-evidence.mjs . research/galaxy-audit/generated

      - name: Test progressive Piscine study paths
        run: node --test research/galaxy-audit/scripts/sequence-piscines.test.mjs

      - name: Build progressive Piscine study paths
        run: node research/galaxy-audit/scripts/sequence-piscines.mjs . research/galaxy-audit/generated

      - name: Test Piscine competency and evidence extractor
        run: node --test research/galaxy-audit/scripts/build-piscine-competencies.test.mjs

      - name: Generate per-exercise requirements and mastery gates
        run: node research/galaxy-audit/scripts/build-piscine-competencies.mjs . research/galaxy-audit/generated

      - name: Test difficulty ranking and prerequisite review
        run: node --test research/galaxy-audit/scripts/rank-piscine-difficulty.test.mjs

      - name: Rank exercise difficulty and inspect prerequisite evidence
        run: node research/galaxy-audit/scripts/rank-piscine-difficulty.mjs . research/galaxy-audit/generated

      - name: Test concept prerequisite maps and source identity corrections
        run: node --test research/galaxy-audit/scripts/build-concept-prerequisites.test.mjs

      - name: Build concept prerequisite maps and outlier queues
        run: node research/galaxy-audit/scripts/build-concept-prerequisites.mjs . research/galaxy-audit/generated

      - name: Test Phase 15 README concept evidence and manual stage corrections
        run: node --test research/galaxy-audit/scripts/verify-piscine-concepts.test.mjs

      - name: Verify source-backed concepts and reviewed learning stages
        run: node research/galaxy-audit/scripts/verify-piscine-concepts.mjs . research/galaxy-audit/generated

      - name: Test Phase 16 evidence triage and manual README review
        run: node --test research/galaxy-audit/scripts/triage-piscine-evidence.test.mjs

      - name: Reconcile 110 low-evidence candidates and flag ambiguous keywords
        run: node research/galaxy-audit/scripts/triage-piscine-evidence.mjs . research/galaxy-audit/generated

      - name: Test Phase 17 semantic source corrections and 24 mastery assessments
        run: node --test research/galaxy-audit/scripts/apply-semantic-source-reviews.test.mjs

      - name: Build Phase 17 reviewed curriculum and original mastery handbook
        run: node research/galaxy-audit/scripts/apply-semantic-source-reviews.mjs . research/galaxy-audit/generated

      - name: Test closure of all 95 public-source semantic reviews
        run: node --test research/galaxy-audit/scripts/complete-semantic-piscine-reviews.test.mjs

      - name: Produce the completed Phase 18 curriculum and reviewed guides
        run: node research/galaxy-audit/scripts/complete-semantic-piscine-reviews.mjs . research/galaxy-audit/generated

      - name: Test Imperative satellite and raid classification
        run: node --test research/galaxy-audit/scripts/verify-imperative-satellites.test.mjs

      - name: Verify Phase 20 satellite source evidence
        run: node research/galaxy-audit/scripts/verify-imperative-satellites.mjs . research/galaxy-audit/generated

      - name: Test 33 additional audited top-level project classifications
        run: node --test research/galaxy-audit/scripts/verify-expanded-projects.test.mjs

      - name: Generate expanded project classification and source attestations
        run: node research/galaxy-audit/scripts/verify-expanded-projects.mjs . research/galaxy-audit/generated

      - name: Test Phase 21 top-level subject classification
        run: node --test research/galaxy-audit/scripts/classify-top-level-satellites.test.mjs

      - name: Generate complete top-level audited and unaudited index
        run: node research/galaxy-audit/scripts/classify-top-level-satellites.mjs . research/galaxy-audit/generated

      - name: Test Phase 22 backlog reconciliation
        run: node --test research/galaxy-audit/scripts/validate-phase22-coverage.test.mjs

      - name: Verify 736-subject coverage and ten README source phrases
        run: node research/galaxy-audit/scripts/validate-phase22-coverage.mjs .

      - name: Test Phase 23 screenshot source anchors
        run: node --test research/galaxy-audit/scripts/verify-phase23-visual-anchors.test.mjs

      - name: Verify visual labels, source hashes, and core arc identities
        run: node research/galaxy-audit/scripts/verify-phase23-visual-anchors.mjs .

      - name: Test Phase 24 unmatched README triage
        run: node --test research/galaxy-audit/scripts/triage-remaining-446.test.mjs

      - name: Scan all 446 archive-unmatched public README files
        run: node research/galaxy-audit/scripts/triage-remaining-446.mjs . research/galaxy-audit/generated

      - name: Test Phase 25 manual source reviews
        run: node --test research/galaxy-audit/scripts/verify-phase25-semantic-reviews.test.mjs

      - name: Verify 34 manual semantic reviews against README text and priority queue
        run: node research/galaxy-audit/scripts/verify-phase25-semantic-reviews.mjs . research/galaxy-audit/generated

      - name: Test Phase 26 full-source exporter
        run: node --test research/galaxy-audit/scripts/export-phase26-priority-sources.test.mjs

      - name: Export Phase 26 priority sources for manual semantic inspection
        run: node research/galaxy-audit/scripts/export-phase26-priority-sources.mjs . research/galaxy-audit/generated

      - name: Test Phase 26 reviewed semantic groups
        run: node --test research/galaxy-audit/scripts/verify-phase26-reviewed-groups.test.mjs

      - name: Source-verify all 285 Phase 26 priority classifications
        run: node research/galaxy-audit/scripts/verify-phase26-reviewed-groups.mjs . research/galaxy-audit/generated

      - name: Test Phase 27 full source classifications
        run: node --test research/galaxy-audit/scripts/verify-phase27-nonpriority.test.mjs

      - name: Verify final 127 nonpriority README classifications
        run: node research/galaxy-audit/scripts/verify-phase27-nonpriority.mjs . research/galaxy-audit/generated

      - name: Test Phase 27 source gaps and evidence relationships
        run: node --test research/galaxy-audit/scripts/verify-phase27-evidence.test.mjs

      - name: Verify recovered historical sources and 16 documented relationships
        run: node research/galaxy-audit/scripts/verify-phase27-evidence.mjs . research/galaxy-audit/generated

      - name: Extract the entire public subjects tree
        run: node research/galaxy-audit/scripts/extract-subject-links.mjs . research/galaxy-audit/generated

      - name: Deduplicate and triage candidate project links
        run: node research/galaxy-audit/scripts/triage-subject-links.mjs research/galaxy-audit/generated

      - name: Build evidence-typed graph
        run: node research/galaxy-audit/scripts/build-curated-graph.mjs research/galaxy-audit/generated

      - name: Print and save scan summary
        shell: bash
        run: |
          node --input-type=module <<'EOF' | tee research/galaxy-audit/generated/summary.txt
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('research/galaxy-audit/generated/subject-link-extraction.json', 'utf8'));
          const hist = {};
          for (const edge of r.edges) hist[edge.type] = (hist[edge.type] || 0) + 1;
          console.log(JSON.stringify({ ...r.metadata, relation_types: hist }, null, 2));
          if (r.metadata.subject_count < 1000) {
            throw new Error('Unexpectedly small subject count; audit source checkout');
          }
          EOF

      - name: Upload JSON, CSV and summary
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-subject-link-audit
          path: |
            research/galaxy-audit/generated/subject-link-extraction.json
            research/galaxy-audit/generated/subject-link-edges.csv
            research/galaxy-audit/generated/subject-node-summary.csv
            research/galaxy-audit/generated/summary.txt
            research/galaxy-audit/generated/triaged-project-links.json
            research/galaxy-audit/generated/triage-summary.json
            research/galaxy-audit/generated/curated-galaxy-graph.json
            research/galaxy-audit/generated/curated-galaxy-edges.csv
            research/galaxy-audit/generated/piscine-language-evidence.json
            research/galaxy-audit/generated/piscine-explicit-mentions.json
            research/galaxy-audit/generated/piscine-progressive-sequences.json
            research/galaxy-audit/generated/go-progressive-sequence.csv
            research/galaxy-audit/generated/rust-progressive-sequence.csv
            research/galaxy-audit/generated/javascript-progressive-sequence.csv
            research/galaxy-audit/generated/go-progressive-study-guide.md
            research/galaxy-audit/generated/rust-progressive-study-guide.md
            research/galaxy-audit/generated/javascript-progressive-study-guide.md
            research/galaxy-audit/generated/piscine-competency-evidence.json
            research/galaxy-audit/generated/go-mastery-and-requirements.md
            research/galaxy-audit/generated/rust-mastery-and-requirements.md
            research/galaxy-audit/generated/javascript-mastery-and-requirements.md
            research/galaxy-audit/generated/piscine-difficulty-and-dependency-review.json
            research/galaxy-audit/generated/piscine-unmatched-review.json
            research/galaxy-audit/generated/go-difficulty-ranked-guide.md
            research/galaxy-audit/generated/rust-difficulty-ranked-guide.md
            research/galaxy-audit/generated/javascript-difficulty-ranked-guide.md
            research/galaxy-audit/generated/piscine-concept-prerequisite-graph.json
            research/galaxy-audit/generated/go-concept-prerequisite-guide.md
            research/galaxy-audit/generated/rust-concept-prerequisite-guide.md
            research/galaxy-audit/generated/javascript-concept-prerequisite-guide.md
            research/galaxy-audit/generated/piscine-readme-concept-evidence-phase15.json
            research/galaxy-audit/generated/go-source-checked-study-guide.md
            research/galaxy-audit/generated/rust-source-checked-study-guide.md
            research/galaxy-audit/generated/javascript-source-checked-study-guide.md
            research/galaxy-audit/generated/piscine-phase16-triaged-curriculum.json
            research/galaxy-audit/generated/piscine-phase16-keyword-review-queue.json
            research/galaxy-audit/generated/go-phase16-reviewed-study-guide.md
            research/galaxy-audit/generated/rust-phase16-reviewed-study-guide.md
            research/galaxy-audit/generated/javascript-phase16-reviewed-study-guide.md
            research/galaxy-audit/generated/piscine-phase17-semantic-curriculum.json
            research/galaxy-audit/generated/piscine-phase17-pending-source-reviews.json
            research/galaxy-audit/generated/go-phase17-semantic-study-guide.md
            research/galaxy-audit/generated/rust-phase17-semantic-study-guide.md
            research/galaxy-audit/generated/javascript-phase17-semantic-study-guide.md
            research/galaxy-audit/generated/phase17-original-mastery-assessments.md
            research/galaxy-audit/generated/piscine-phase18-complete-source-audit.json
            research/galaxy-audit/generated/piscine-phase18-completed-95-review-log.json
            research/galaxy-audit/generated/piscine-phase18-unplaced-candidates.json
            research/galaxy-audit/generated/go-phase18-source-checked-guide.md
            research/galaxy-audit/generated/rust-phase18-source-checked-guide.md
            research/galaxy-audit/generated/javascript-phase18-source-checked-guide.md
            research/galaxy-audit/generated/phase20-imperative-satellite-verification.json
            research/galaxy-audit/generated/phase20-imperative-satellite-guide.md
            research/galaxy-audit/generated/phase21-top-level-subject-classification.json
            research/galaxy-audit/generated/phase21-top-level-project-guide.md
            research/galaxy-audit/generated/phase21-expanded-project-verification.json
            research/galaxy-audit/generated/phase21-expanded-project-guide.md
            research/galaxy-audit/generated/phase24-unmatched-readme-triage.json
            research/galaxy-audit/generated/phase24-triage-report.md
            research/galaxy-audit/generated/phase24-summary.json
            research/galaxy-audit/generated/phase25-semantic-review-attestation.json
            research/galaxy-audit/generated/phase26-285-full-source-bundle.json
            research/galaxy-audit/generated/phase26-source-verified-285.json
            research/galaxy-audit/generated/phase26-source-verified-guide.md
            research/galaxy-audit/generated/phase27-source-verified-127.json
            research/galaxy-audit/generated/phase27-source-verified-127.md
            research/galaxy-audit/generated/phase27-evidence-attestation.json
          retention-days: 14
          if-no-files-found: error
